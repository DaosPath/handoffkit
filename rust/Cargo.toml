[workspace]
members = [
  "crates/handoffkit-contracts",
  "crates/handoffkit-protocol",
  "crates/handoffkit-runtime",
  "crates/handoffkit-transport",
  "crates/handoffkit-cli",
  "handoffkit",
]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
version = "1.19.0"
edition = "2021"
authors = ["DaosPath <daospath@gmail.com>"]
license = "MIT"
repository = "https://github.com/DaosPath/handoffkit"
homepage = "https://github.com/DaosPath/handoffkit"
rust-version = "1.82"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2.2", features = ["pem", "pkcs8", "rand_core"] }
hex = "0.4"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = "=0.3.44"
tokio = { version = "1.40", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["rt"] }
x509-parser = "0.18"
