[package]
name = "handoffkit-transport"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "HK-CSP stdio and subprocess transports"
readme = "README.md"
keywords = ["csp", "stdio", "subprocess", "agents", "handoff"]
categories = ["asynchronous", "development-tools"]

[dependencies]
async-trait.workspace = true
futures-util = { version = "0.3", optional = true }
handoffkit-protocol = { path = "../handoffkit-protocol", version = "1.17.0" }
handoffkit-runtime = { path = "../handoffkit-runtime", version = "1.17.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.26", optional = true }

[features]
default = []
websocket = ["dep:futures-util", "dep:tokio-tungstenite"]
