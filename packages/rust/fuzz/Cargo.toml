[package]
name = "handoffkit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
handoffkit-protocol = { path = "../crates/handoffkit-protocol" }
handoffkit-runtime = { path = "../crates/handoffkit-runtime" }
handoffkit-transport = { path = "../crates/handoffkit-transport" }
libfuzzer-sys = "0.4"
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt", "sync", "time"] }

[workspace]
members = ["."]

[[bin]]
name = "envelope_json"
path = "fuzz_targets/envelope_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ndjson_frame"
path = "fuzz_targets/ndjson_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake"
path = "fuzz_targets/handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "contracts"
path = "fuzz_targets/contracts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sanitization"
path = "fuzz_targets/sanitization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "timestamps"
path = "fuzz_targets/timestamps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_commands"
path = "fuzz_targets/session_commands.rs"
test = false
doc = false
bench = false

