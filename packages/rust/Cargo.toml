[workspace]
members = [
  "crates/handoffkit-contracts",
  "crates/handoffkit-protocol",
  "handoffkit",
]
resolver = "2"

[workspace.package]
version = "1.16.0"
edition = "2021"
authors = ["DaosPath <daospath@gmail.com>"]
license = "MIT"
repository = "https://github.com/DaosPath/handoffkit"
homepage = "https://github.com/DaosPath/handoffkit"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
