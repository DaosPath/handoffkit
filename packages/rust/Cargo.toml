[workspace]
members = [
  "crates/handoffkit-contracts",
  "crates/handoffkit-protocol",
  "crates/handoffkit-runtime",
  "crates/handoffkit-transport",
  "crates/handoffkit-cli",
  "handoffkit",
]
resolver = "2"

[workspace.package]
version = "1.17.0"
edition = "2021"
authors = ["DaosPath <daospath@gmail.com>"]
license = "MIT"
repository = "https://github.com/DaosPath/handoffkit"
homepage = "https://github.com/DaosPath/handoffkit"
rust-version = "1.82"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
