[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handoffkit"
version = "1.20.0"
description = "A lightweight Python framework for building multi-agent workflows with structured state transfer protocols."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "DaosPath" }
]
keywords = [
  "agents",
  "handoff",
  "multi-agent",
  "state-transfer",
  "protocols",
  "ai"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = [
  "cryptography>=46,<50",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "hypothesis>=6.131.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "setuptools>=77",
  "twine>=6.0.0",
  "wheel"
]

[project.urls]
Homepage = "https://github.com/DaosPath/handoffkit"
Source = "https://github.com/DaosPath/handoffkit"
Issues = "https://github.com/DaosPath/handoffkit/issues"

[project.scripts]
handoffkit = "handoffkit.cli:main"

[tool.setuptools.packages.find]
include = ["handoffkit*"]
# Research-only labs stay in the source repository and are not shipped on PyPI.
exclude = ["handoffkit.clinical*", "handoffkit.crypto_research*"]

[tool.setuptools.package-data]
# Only the 30-case doctor set is bundled; 100/400 are fetched on demand (pinned + SHA-256).
handoffkit = ["py.typed", "benchmarks/data/doctor_cases_30.json"]

[tool.setuptools.exclude-package-data]
handoffkit = [
  "benchmarks/data/doctor_cases_100.json",
  "benchmarks/data/doctor_cases_400.json",
  "clinical/*",
  "clinical/**/*",
  "crypto_research/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
  "monorepo: needs full monorepo files (skipped in bare sdist layouts)",
]

[tool.coverage.run]
branch = true
source = ["handoffkit"]
omit = [
  "handoffkit/cli.py",
  "handoffkit/benchmarks/*",
]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
