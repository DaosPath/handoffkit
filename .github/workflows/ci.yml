name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # P0: Ruff must pass before tests (blocks merge / release readiness)
      - name: Run Ruff (blocking)
        run: ruff check --no-cache .

      - name: Run tests
        run: python -m pytest -q

      - name: Run TLS, mTLS, replay, and artifact security integration
        run: >
          python -m pytest -q
          tests/test_csp_tls_integration.py
          tests/test_artifact_signatures.py
          tests/test_security_conformance.py

      - name: Tools + validation coverage gate
        # Mandatory coverage for sandbox / shell / tool execution / validation (P0)
        # (excludes medical/text helpers until those modules are split/refactored in P1)
        run: >
          python -m pytest -q
          tests/test_tool_execution.py
          tests/test_shell_safety.py
          tests/test_sandbox_policy.py
          tests/test_validation.py
          tests/test_contract_validation.py
          --cov=handoffkit.tools.shell
          --cov=handoffkit.tools.filesystem
          --cov=handoffkit.tool_execution
          --cov=handoffkit.safety
          --cov=handoffkit.sandbox
          --cov=handoffkit.validation
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Build package
        run: python -m build

      - name: Install twine
        run: python -m pip install twine

      - name: Check package metadata
        run: twine check dist/*

  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python for ephemeral TLS fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install TLS fixture generator dependency
        run: python -m pip install "cryptography>=46,<50"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Check, test, and package JavaScript workspace
        run: pnpm ci:js

      - name: Lint web app
        run: pnpm web:lint

      - name: Typecheck web app
        run: pnpm --dir apps/web exec tsc --noEmit

      - name: Studio unit tests (parse-rankings)
        run: pnpm --dir apps/web run test:studio

      - name: Build web app
        run: pnpm web:build

  node-pq:
    name: Node 24 hybrid-PQ provider
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js with the compatible OpenSSL provider
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python for ephemeral TLS fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install TLS fixture generator dependency
        run: python -m pip install "cryptography>=46,<50"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Prove X25519MLKEM768 negotiation and fail-closed profile handling
        env:
          HANDOFFKIT_REQUIRE_HYBRID_PQ: "1"
        run: node --test packages/js/node/test/tls.integration.test.js

      - name: Benchmark standard and hybrid-PQ TLS on the active provider
        env:
          HANDOFFKIT_REQUIRE_HYBRID_PQ: "1"
        run: |
          mkdir -p .local-tests
          node benchmarks/security/node-security-benchmark.mjs \
            --iterations=10 --warmup=3 --bytes=1048576 \
            | tee .local-tests/node-security-benchmark.json
          node -e "JSON.parse(require('fs').readFileSync('.local-tests/node-security-benchmark.json'))"

  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python for ephemeral TLS fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install TLS fixture generator dependency
        run: python -m pip install "cryptography>=46,<50"

      - name: Check declared Rust 1.82 MSRV
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          cargo +1.82.0 check --manifest-path packages/rust/Cargo.toml \
            --workspace --all-targets --locked

      - name: Check Rust formatting
        run: cargo fmt --manifest-path packages/rust/Cargo.toml --all --check

      - name: Lint Rust workspace
        run: cargo clippy --manifest-path packages/rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --manifest-path packages/rust/Cargo.toml --workspace --locked

      - name: Validate publishable Rust crates
        shell: bash
        run: |
          set -euo pipefail
          for crate in \
            handoffkit-contracts \
            handoffkit-protocol \
            handoffkit-runtime \
            handoffkit-transport \
            handoffkit-cli \
            handoffkit
          do
            cargo package \
              --manifest-path packages/rust/Cargo.toml \
              --package "$crate" \
              --locked \
              --allow-dirty \
              --list >/dev/null
          done
          cargo package --manifest-path packages/rust/Cargo.toml \
            --workspace --locked --allow-dirty --no-verify

  cpp:
    name: C++
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure C++ package
        run: >
          cmake -S packages/cpp -B packages/cpp/build
          -DCMAKE_BUILD_TYPE=Release
          -DHANDOFFKIT_WITH_HTTP=OFF
          -DHANDOFFKIT_WITH_CRYPTO=ON
          -DHANDOFFKIT_BUILD_BENCHMARKS=ON

      - name: Build C++ package
        run: cmake --build packages/cpp/build --config Release

      - name: Test C++ package
        run: ctest --test-dir packages/cpp/build -C Release --output-on-failure

      - name: Configure C++ security sanitizers
        run: >
          cmake -S packages/cpp -B packages/cpp/build-sanitizers
          -DCMAKE_BUILD_TYPE=Debug
          -DHANDOFFKIT_WITH_HTTP=OFF
          -DHANDOFFKIT_WITH_CRYPTO=ON
          -DHANDOFFKIT_BUILD_EXAMPLES=OFF
          -DHANDOFFKIT_BUILD_DEMOS=OFF
          -DHANDOFFKIT_BUILD_CLI=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Run C++ security tests with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake --build packages/cpp/build-sanitizers --config Debug --parallel 2 \
            --target test_csp_security test_security_conformance \
              test_artifact_signatures test_native_compute
          ctest --test-dir packages/cpp/build-sanitizers -C Debug \
            -R '^(test_csp_security|test_security_conformance|test_artifact_signatures|test_native_compute)$' \
            --output-on-failure

      - name: Benchmark C++ native compute worker
        run: |
          mkdir -p .local-tests
          packages/cpp/build/native_compute_benchmark 500 \
            > .local-tests/cpp-native-compute-benchmark.json
          python3 -m json.tool .local-tests/cpp-native-compute-benchmark.json >/dev/null

      - name: Configure cpp-ml CSP adapters
        run: >
          cmake -S packages/cpp-ml -B packages/cpp-ml/build-csp
          -DCMAKE_BUILD_TYPE=Release
          -DHANDOFFKIT_ML_LINK_CORE=ON
          -DHANDOFFKIT_ML_BUILD_TESTS=ON
          -DHANDOFFKIT_ML_BUILD_CLI=OFF
          -DHANDOFFKIT_BUILD_TESTS=OFF
          -DHANDOFFKIT_BUILD_EXAMPLES=OFF
          -DHANDOFFKIT_BUILD_CLI=OFF
          -DHANDOFFKIT_BUILD_DEMOS=OFF

      - name: Build cpp-ml CSP workers
        run: cmake --build packages/cpp-ml/build-csp --config Release

      - name: Test complete cpp-ml suite including CSP workers
        run: ctest --test-dir packages/cpp-ml/build-csp -C Release --output-on-failure

      - name: Fusion roles --file smoke (offline)
        run: |
          CLI=packages/cpp/build/handoffkit-cli
          PACK=packages/cpp/examples/fusion/role_packs/custom_review.json
          test -x "$CLI" || CLI=packages/cpp/build/Release/handoffkit-cli
          test -f "$PACK"
          out="$("$CLI" fusion roles --file "$PACK")"
          echo "$out" | head -n 40
          echo "$out" | grep -q 'ex_corr_arch'
          echo "$out" | grep -q 'ex_ops_arch'
          echo "$out" | grep -q 'ex_review_merge'
          echo "$out" | grep -q 'CorrectnessArchitect'
          "$CLI" fusion explain --tier medium --mode ultra | tee /tmp/fusion-explain.txt
          grep -q 'mode=ultra' /tmp/fusion-explain.txt
          grep -q 'skeptic' /tmp/fusion-explain.txt

      - name: Package source tarball (smoke)
        run: cmake --build packages/cpp/build --target package_source_tarball --config Release

      - name: Install prefix smoke
        run: |
          cmake --install packages/cpp/build --prefix "$HOME/handoffkit-prefix" --config Release
          test -f "$HOME/handoffkit-prefix/include/handoffkit/handoffkit.hpp"
          test -f "$HOME/handoffkit-prefix/include/handoffkit/handoffkit_core.hpp"
          test -f "$HOME/handoffkit-prefix/lib/cmake/handoffkit/HandoffKitConfig.cmake" \
            || test -f "$HOME/handoffkit-prefix/lib64/cmake/handoffkit/HandoffKitConfig.cmake"
          test -f "$HOME/handoffkit-prefix/lib/libhandoffkit_core.a" \
            || test -f "$HOME/handoffkit-prefix/lib64/libhandoffkit_core.a"

      - name: Consumer core find_package smoke
        run: |
          cmake -S packages/cpp/examples/consumer_core -B packages/cpp/build-consumer \
            -DCMAKE_PREFIX_PATH="$HOME/handoffkit-prefix" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build packages/cpp/build-consumer --config Release
          packages/cpp/build-consumer/consumer_core /tmp/handoffkit-consumer-reports

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/go

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Python for ephemeral TLS fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install TLS fixture generator dependency
        run: python -m pip install "cryptography>=46,<50"

      - name: Format Go code
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: go test ./...

      - name: Run go test -race
        run: go test -race ./...

      - name: Build Go worker binary
        run: |
          mkdir -p ../../.local-tests/bin
          go build -o ../../.local-tests/bin/handoffkit-worker ./cmd/handoffkit-worker

  go-pq:
    name: Go 1.26 hybrid-PQ provider and Node interoperability
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up provider-compatible Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Set up provider-compatible Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python for ephemeral TLS fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install TLS fixture generator dependency
        run: python -m pip install "cryptography>=46,<50"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Prove X25519MLKEM768 negotiation, downgrade rejection, and Node interoperability
        env:
          GODEBUG: tlsmlkem=1
          HANDOFFKIT_REQUIRE_HYBRID_PQ: "1"
          HANDOFFKIT_RUN_HYBRID_INTEROP: "1"
        run: >
          go test -count=1
          -run "TestGoHybridPQNegotiatesX25519MLKEM768|TestGoHybridPQRejectsDirectStandardTLSWrapping|TestGoNodeHybridPQMTLSInteroperability"
          ./transport
        working-directory: packages/go

  csp-interop:
    name: HK-CSP Python / JavaScript / Rust / Go stdio
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Install Python package
        run: python -m pip install -e packages/python

      - name: Build Rust worker
        run: cargo build --manifest-path packages/rust/Cargo.toml -p handoffkit-cli

      - name: Build Go worker
        run: |
          mkdir -p .local-tests/bin
          (cd packages/go && go build -o ../../.local-tests/bin/handoffkit-worker ./cmd/handoffkit-worker)

      - name: Rust starts Python, JavaScript, and Go workers
        env:
          HANDOFFKIT_RUN_INTEROP_TESTS: "1"
        run: >
          cargo test --manifest-path packages/rust/Cargo.toml
          -p handoffkit-transport --test cross_runtime -- --nocapture

      - name: Go starts Python, JavaScript, and Rust workers
        env:
          HANDOFFKIT_RUN_INTEROP_TESTS: "1"
        run: >
          (cd packages/go && go test -v ./interop/...)

      - name: Python starts JavaScript worker
        run: python packages/python/examples/csp_python_js_stdio_demo.py

      - name: Python starts Rust worker
        run: python packages/python/examples/csp_python_rust_stdio_demo.py

      - name: Python starts Go worker
        run: python packages/python/examples/csp_python_go_stdio_demo.py

      - name: JavaScript starts Rust worker
        run: node packages/js/node/examples/csp_js_rust_stdio_demo.mjs

      - name: JavaScript starts Go worker
        run: node packages/js/node/examples/csp_js_go_stdio_demo.mjs

