name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # P0: Ruff must pass before tests (blocks merge / release readiness)
      - name: Run Ruff (blocking)
        run: ruff check --no-cache .

      - name: Run tests
        run: python -m pytest -q

      - name: Run TLS, mTLS, replay, and artifact security integration
        run: >
          python -m pytest -q
          tests/test_csp_tls_integration.py
          tests/test_artifact_signatures.py
          tests/test_security_conformance.py

      - name: Tools + validation coverage gate
        # Mandatory coverage for sandbox / shell / tool execution / validation (P0)
        # (excludes medical/text helpers until those modules are split/refactored in P1)
        run: >
          python -m pytest -q
          tests/test_tool_execution.py
          tests/test_shell_safety.py
          tests/test_sandbox_policy.py
          tests/test_validation.py
          tests/test_contract_validation.py
          --cov=handoffkit.tools.shell
          --cov=handoffkit.tools.filesystem
          --cov=handoffkit.tool_execution
          --cov=handoffkit.safety
          --cov=handoffkit.sandbox
          --cov=handoffkit.validation
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Build package
        run: python -m build

      - name: Install twine
        run: python -m pip install twine

      - name: Check package metadata
        run: twine check dist/*

      - name: Clean-install built wheel and verify metadata
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="../../.local-tests/python-wheel-smoke-${{ matrix.python-version }}"
          expected_version=$(python -c 'import re; text=open("pyproject.toml", encoding="utf-8").read(); print(re.search(r"^version\s*=\s*\"([^\"]+)\"", text, re.MULTILINE).group(1))')
          python -m venv "$smoke_dir"
          "$smoke_dir/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          EXPECTED_VERSION="$expected_version" "$smoke_dir/bin/python" -c 'import importlib.metadata as metadata; import os; import handoffkit; expected=os.environ["EXPECTED_VERSION"]; assert handoffkit.__version__ == expected; assert metadata.version("handoffkit") == expected'

  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python for ephemeral TLS fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install TLS fixture generator dependency
        run: python -m pip install "cryptography>=46,<50"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm security:dependencies

      - name: Archive dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-dependency-audit
          path: reports/BROWSER_1.20_DEPENDENCY_AUDIT.json
          if-no-files-found: error

      - name: Check, test, and package JavaScript workspace
        run: pnpm ci:js

      - name: Lint web app
        run: pnpm web:lint

      - name: Typecheck web app
        run: pnpm --dir apps/web exec tsc --noEmit

      - name: Studio unit tests (rankings and runtime security)
        run: pnpm --dir apps/web run test:studio

      - name: Build web app
        run: pnpm web:build

      - name: Studio runtime security accessibility and redaction smoke
        run: pnpm --dir apps/web run test:studio:e2e

  browser-platform:
    name: Browser 1.20 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-13
          - macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Browser Core, Lite, and Real unit tests
        shell: bash
        run: |
          pnpm --dir packages/js/browser-core test
          pnpm --dir packages/js/browser test
          pnpm --dir packages/js/browser-lite test
          pnpm --dir packages/js/browser-real test

      - name: Produce per-runner package checksums
        env:
          HANDOFFKIT_PACKAGE_CHECKSUMS_OUTPUT: browser-package-checksums.json
        run: pnpm js:pack:checksums

      - name: Archive per-runner package checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-package-checksums-${{ matrix.os }}
          path: browser-package-checksums.json
          if-no-files-found: error

  browser-real-chromium:
    name: Browser Real Chromium (Linux x64)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium explicitly
        run: pnpm --dir packages/js/browser-real run install-chromium
      - name: Run Playwright fixture suite
        env:
          HANDOFFKIT_BROWSER_REAL_PLAYWRIGHT: "1"
        run: pnpm --dir packages/js/browser-real test

  browser-real-tls:
    name: Browser Real mTLS sockets (Linux x64)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Python for TLS fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install TLS fixture generator dependency
        run: python -m pip install "cryptography>=46,<50"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile
      - name: Run Browser Real mTLS socket suite
        env:
          HANDOFFKIT_BROWSER_REAL_TLS: "1"
        run: pnpm --dir packages/js/browser-real test

      - name: Configure C++ Browser Real TCP client
        run: >
          cmake -S packages/cpp -B .local-tests/cpp-browser-real-ci
          -DCMAKE_BUILD_TYPE=Release
          -DHANDOFFKIT_WITH_HTTP=OFF
          -DHANDOFFKIT_WITH_CRYPTO=ON
          -DHANDOFFKIT_WITH_TLS=ON
          -DHANDOFFKIT_BUILD_EXAMPLES=OFF
          -DHANDOFFKIT_BUILD_DEMOS=OFF
          -DHANDOFFKIT_BUILD_CLI=OFF

      - name: Build C++ Browser Real TCP client
        run: cmake --build .local-tests/cpp-browser-real-ci --config Release --target test_browser_real_tls

      - name: Run C++ to Node Browser Real TCP interop
        env:
          HANDOFFKIT_CPP_BROWSER_REAL_CLIENT: ${{ github.workspace }}/.local-tests/cpp-browser-real-ci/test_browser_real_tls
        run: pnpm browser:real:cpp-interop

  node-pq:
    name: Node 24 hybrid-PQ provider
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js with the compatible OpenSSL provider
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python for ephemeral TLS fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install TLS fixture generator dependency
        run: python -m pip install "cryptography>=46,<50"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Prove X25519MLKEM768 negotiation and fail-closed profile handling
        env:
          HANDOFFKIT_REQUIRE_HYBRID_PQ: "1"
        run: node --test packages/js/node/test/tls.integration.test.js

      - name: Benchmark standard and hybrid-PQ TLS on the active provider
        env:
          HANDOFFKIT_REQUIRE_HYBRID_PQ: "1"
        run: |
          mkdir -p .local-tests
          node benchmarks/security/node-security-benchmark.mjs \
            --iterations=10 --warmup=3 --bytes=1048576 \
            | tee .local-tests/node-security-benchmark.json
          node -e "const value=JSON.parse(require('fs').readFileSync('.local-tests/node-security-benchmark.json')); if (value.notice !== 'Environmental measurement — not a performance guarantee.') throw new Error('benchmark notice mismatch'); if (!value.hybrid_pq?.available) throw new Error('hybrid-pq benchmark unavailable')"

  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python for ephemeral TLS fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install TLS fixture generator dependency
        run: python -m pip install "cryptography>=46,<50"

      - name: Check declared Rust 1.82 MSRV
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          cargo +1.82.0 check --manifest-path packages/rust/Cargo.toml \
            --workspace --all-targets --locked

      - name: Check Rust formatting
        run: cargo fmt --manifest-path packages/rust/Cargo.toml --all --check

      - name: Lint Rust workspace
        run: cargo clippy --manifest-path packages/rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --manifest-path packages/rust/Cargo.toml --workspace --locked

      - name: Validate publishable Rust crates
        shell: bash
        run: |
          set -euo pipefail
          for crate in \
            handoffkit-contracts \
            handoffkit-protocol \
            handoffkit-runtime \
            handoffkit-transport \
            handoffkit-cli \
            handoffkit
          do
            cargo package \
              --manifest-path packages/rust/Cargo.toml \
              --package "$crate" \
              --locked \
              --allow-dirty \
              --list >/dev/null
          done
          cargo package --manifest-path packages/rust/Cargo.toml \
            --workspace --locked --allow-dirty --no-verify

  cpp:
    name: C++
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go for secure cpp-ml gateway integration
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Node.js for C++ TCP interoperability
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust for C++ TCP interoperability
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python for ephemeral TLS fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install TLS fixture generator dependency
        run: python -m pip install "cryptography>=46,<50"

      - name: Configure C++ package
        run: >
          cmake -S packages/cpp -B packages/cpp/build
          -DCMAKE_BUILD_TYPE=Release
          -DHANDOFFKIT_WITH_HTTP=OFF
          -DHANDOFFKIT_WITH_CRYPTO=ON
          -DHANDOFFKIT_WITH_TLS=ON
          -DHANDOFFKIT_BUILD_BENCHMARKS=ON

      - name: Build C++ package
        run: cmake --build packages/cpp/build --config Release

      - name: Test C++ package
        run: ctest --test-dir packages/cpp/build -C Release --output-on-failure

      - name: Install C++ package and build external consumer
        run: bash packages/cpp/scripts/consumer_install_smoke.sh

      - name: Configure C++ security sanitizers
        run: >
          cmake -S packages/cpp -B packages/cpp/build-sanitizers
          -DCMAKE_BUILD_TYPE=Debug
          -DHANDOFFKIT_WITH_HTTP=OFF
          -DHANDOFFKIT_WITH_CRYPTO=ON
          -DHANDOFFKIT_BUILD_EXAMPLES=OFF
          -DHANDOFFKIT_BUILD_DEMOS=OFF
          -DHANDOFFKIT_BUILD_CLI=OFF
          -DHANDOFFKIT_WITH_TLS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Run C++ security tests with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake --build packages/cpp/build-sanitizers --config Debug --parallel 2 \
            --target test_csp_security test_security_conformance test_tls_transport \
              test_os_keystore test_secure_memory test_durable_scheduler \
              test_artifact_signatures test_artifact_gate test_native_compute test_edge_profiles
          ctest --test-dir packages/cpp/build-sanitizers -C Debug \
            -R '^(test_csp_security|test_security_conformance|test_tls_transport|test_os_keystore|test_secure_memory|test_durable_scheduler|test_artifact_signatures|test_artifact_gate|test_native_compute|test_edge_profiles)$' \
            --output-on-failure

      - name: Benchmark C++ native compute worker
        run: |
          mkdir -p .local-tests
          packages/cpp/build/native_compute_benchmark 500 \
            > .local-tests/cpp-native-compute-benchmark.json
          python3 -c "import json; value=json.load(open('.local-tests/cpp-native-compute-benchmark.json')); assert value['notice'] == 'Environmental measurement — not a performance guarantee.'; assert value['latency_ms']['p99'] >= value['latency_ms']['p50']"

      - name: Benchmark C++ TLS handshakes on real sockets
        run: |
          packages/cpp/build/test_tls_transport --benchmark \
            > .local-tests/cpp-tls-handshake-benchmark.json
          python3 -c "import json; value=json.load(open('.local-tests/cpp-tls-handshake-benchmark.json')); assert value['iterations'] >= 20; assert value['p50_ms'] <= value['p95_ms'] <= value['p99_ms']; assert value['notice'] == 'Environmental measurement - not a performance guarantee.'"

      - name: Configure cpp-ml CSP adapters
        run: >
          cmake -S packages/cpp-ml -B packages/cpp-ml/build-csp
          -DCMAKE_BUILD_TYPE=Release
          -DHANDOFFKIT_ML_LINK_CORE=ON
          -DHANDOFFKIT_ML_TLS=ON
          -DHANDOFFKIT_ML_BUILD_TESTS=ON
          -DHANDOFFKIT_ML_BUILD_CLI=OFF
          -DHANDOFFKIT_BUILD_TESTS=OFF
          -DHANDOFFKIT_BUILD_EXAMPLES=OFF
          -DHANDOFFKIT_BUILD_CLI=OFF
          -DHANDOFFKIT_BUILD_DEMOS=OFF

      - name: Build cpp-ml CSP workers
        run: cmake --build packages/cpp-ml/build-csp --config Release

      - name: Test complete cpp-ml suite including CSP workers
        run: ctest --test-dir packages/cpp-ml/build-csp -C Release --output-on-failure

      - name: Test Node, Go, and Rust TCP TLS interoperability with C++
        env:
          HANDOFFKIT_CPP_ML_WORKER: ${{ github.workspace }}/packages/cpp-ml/build-csp/handoffkit-cpp-ml-worker
        run: |
          mkdir -p .local-tests
          python packages/cpp-ml/tests/interop/test_tcp_interoperability.py \
            "$HANDOFFKIT_CPP_ML_WORKER" \
            | tee .local-tests/cpp-tcp-interoperability.json
          python -c "import json; value=json.load(open('.local-tests/cpp-tcp-interoperability.json')); assert set(value['clients']) == {'python','node','go','rust'}; assert set(value['reverse_servers']) == {'python','node','go','rust'}; assert all(item['protocol'] == 'TLSv1.3' for item in value['clients'].values()); assert all(item['protocol'] == 'TLSv1.3' for item in value['reverse_servers'].values())"

      - name: Test mTLS Go gateway to real cpp-ml worker process
        env:
          HANDOFFKIT_CPP_ML_WORKER: ${{ github.workspace }}/packages/cpp-ml/build-csp/handoffkit-cpp-ml-worker
        run: go test -tags=cppmlintegration -race ./mlgateway
        working-directory: packages/go

      - name: Fusion roles --file smoke (offline)
        run: |
          CLI=packages/cpp/build/handoffkit-cli
          PACK=packages/cpp/examples/fusion/role_packs/custom_review.json
          test -x "$CLI" || CLI=packages/cpp/build/Release/handoffkit-cli
          test -f "$PACK"
          out="$("$CLI" fusion roles --file "$PACK")"
          echo "$out" | head -n 40
          echo "$out" | grep -q 'ex_corr_arch'
          echo "$out" | grep -q 'ex_ops_arch'
          echo "$out" | grep -q 'ex_review_merge'
          echo "$out" | grep -q 'CorrectnessArchitect'
          "$CLI" fusion explain --tier medium --mode ultra | tee /tmp/fusion-explain.txt
          grep -q 'mode=ultra' /tmp/fusion-explain.txt
          grep -q 'skeptic' /tmp/fusion-explain.txt

      - name: Package source tarball (smoke)
        run: cmake --build packages/cpp/build --target package_source_tarball --config Release

      - name: Install prefix smoke
        run: |
          cmake --install packages/cpp/build --prefix "$HOME/handoffkit-prefix" --config Release
          test -f "$HOME/handoffkit-prefix/include/handoffkit/handoffkit.hpp"
          test -f "$HOME/handoffkit-prefix/include/handoffkit/handoffkit_core.hpp"
          test -f "$HOME/handoffkit-prefix/lib/cmake/handoffkit/HandoffKitConfig.cmake" \
            || test -f "$HOME/handoffkit-prefix/lib64/cmake/handoffkit/HandoffKitConfig.cmake"
          test -f "$HOME/handoffkit-prefix/lib/libhandoffkit_core.a" \
            || test -f "$HOME/handoffkit-prefix/lib64/libhandoffkit_core.a"

      - name: Consumer core find_package smoke
        run: |
          cmake -S packages/cpp/examples/consumer_core -B packages/cpp/build-consumer \
            -DCMAKE_PREFIX_PATH="$HOME/handoffkit-prefix" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build packages/cpp/build-consumer --config Release
          packages/cpp/build-consumer/consumer_core /tmp/handoffkit-consumer-reports

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/go

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Python for ephemeral TLS fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install TLS fixture generator dependency
        run: python -m pip install "cryptography>=46,<50"

      - name: Format Go code
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: go test ./...

      - name: Run go test -race
        run: go test -race ./...

      - name: Fuzz finalization parsers with bounded real executions
        shell: bash
        run: |
          set -euo pipefail
          go test ./security -run='^$' -fuzz='^FuzzSecurityTranscriptParser$' -fuzztime=3s
          go test ./security -run='^$' -fuzz='^FuzzDurableReplayStateParser$' -fuzztime=3s
          go test ./security -run='^$' -fuzz='^FuzzDurableRevocationStateParser$' -fuzztime=3s
          go test ./artifactgate -run='^$' -fuzz='^FuzzArtifactSignatureMetadata$' -fuzztime=3s
          go test ./edgeprofile -run='^$' -fuzz='^FuzzEdgeProfileJSON$' -fuzztime=3s
          go test ./studioevents -run='^$' -fuzz='^FuzzStudioEventParser$' -fuzztime=3s

      - name: Measure Go finalization security paths
        run: |
          mkdir -p ../../.local-tests
          go run ./cmd/handoffkit-security-benchmark --iterations=10 --warmup=2 \
            > ../../.local-tests/go-security-finalization-benchmark.json
          python -c "import json; value=json.load(open('../../.local-tests/go-security-finalization-benchmark.json')); assert value['notice'] == 'Environmental measurement — not a performance guarantee.'; assert 'durable_replay_write' in value['measurements']; assert 'studio_event_emit' in value['measurements']"

      - name: Build Go worker binary
        run: |
          mkdir -p ../../.local-tests/bin
          go build -o ../../.local-tests/bin/handoffkit-worker ./cmd/handoffkit-worker

  arm64-edge:
    name: Linux ARM64 edge qualification
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prove execution is native ARM64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/python[dev]"
          pnpm install --frozen-lockfile

      - name: Test Python edge profile and real TLS state routes
        run: >
          python -m pytest -q
          packages/python/tests/test_edge_profiles.py
          packages/python/tests/test_durable_replay.py
          packages/python/tests/test_durable_revocation.py
          packages/python/tests/test_security_transcript.py
          packages/python/tests/test_csp_tls_integration.py

      - name: Test JavaScript edge profile and real Node TLS routes
        run: |
          pnpm --dir packages/js/csp test
          pnpm --dir packages/js/node test

      - name: Test Go edge, recovery, artifact, and TLS routes with race detector
        working-directory: packages/go
        run: go test -race ./edgeprofile ./security ./artifactgate ./transport ./mlgateway ./studioevents

      - name: Measure native ARM64 Go finalization paths
        working-directory: packages/go
        run: |
          mkdir -p ../../.local-tests
          go run ./cmd/handoffkit-security-benchmark --iterations=10 --warmup=2 \
            > ../../.local-tests/go-security-finalization-arm64.json
          python -c "import json; value=json.load(open('../../.local-tests/go-security-finalization-arm64.json')); assert value['environment']['architecture'] == 'arm64'; assert value['notice'] == 'Environmental measurement — not a performance guarantee.'"

      - name: Enforce edge-small resident-memory budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local-tests
          (cd packages/go && go test -c -o ../../.local-tests/edgeprofile-arm64.test ./edgeprofile)
          /usr/bin/time -v -o .local-tests/edge-small-memory.txt \
            .local-tests/edgeprofile-arm64.test \
            -test.run 'TestProfilesMatchSharedFixtureAndApplyRealLimits|TestProfileAppliesTransportWithoutTLSDowngrade|TestEdgeSmallReadOnlyDurableStateFailsClosed'
          rss_kb="$(awk -F: '/Maximum resident set size/ {gsub(/[[:space:]]/, "", $2); print $2}' .local-tests/edge-small-memory.txt)"
          test -n "$rss_kb"
          test "$rss_kb" -le 262144

      - name: Test Rust edge profiles and real TLS transport
        run: >
          cargo test --manifest-path packages/rust/Cargo.toml --locked
          -p handoffkit-protocol -p handoffkit-transport

      - name: Configure native ARM64 C++ edge and security tests
        run: |
          cmake -S packages/cpp -B packages/cpp/build-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DHANDOFFKIT_WITH_HTTP=OFF \
            -DHANDOFFKIT_WITH_CRYPTO=ON \
            -DHANDOFFKIT_WITH_TLS=ON \
            -DHANDOFFKIT_BUILD_EXAMPLES=OFF \
            -DHANDOFFKIT_BUILD_DEMOS=OFF \
            -DHANDOFFKIT_BUILD_CLI=OFF

      - name: Build and test native ARM64 C++ edge and security routes
        run: |
          cmake --build packages/cpp/build-arm64 --parallel 2 \
            --target test_edge_profiles test_csp_security test_security_conformance test_tls_transport \
              test_os_keystore test_secure_memory test_durable_scheduler test_artifact_signatures test_artifact_gate test_native_compute
          ctest --test-dir packages/cpp/build-arm64 --output-on-failure \
            -R '^(test_edge_profiles|test_csp_security|test_security_conformance|test_tls_transport|test_os_keystore|test_secure_memory|test_durable_scheduler|test_artifact_signatures|test_artifact_gate|test_native_compute)$'

      - name: Benchmark native ARM64 C++ TLS handshakes
        run: |
          mkdir -p .local-tests
          packages/cpp/build-arm64/test_tls_transport --benchmark \
            > .local-tests/cpp-tls-handshake-arm64.json
          python -c "import json; value=json.load(open('.local-tests/cpp-tls-handshake-arm64.json')); assert value['iterations'] >= 20; assert value['p50_ms'] <= value['p95_ms'] <= value['p99_ms']; assert value['notice'] == 'Environmental measurement - not a performance guarantee.'"

      - name: Configure native ARM64 cpp-ml CPU worker
        run: >
          cmake -S packages/cpp-ml -B packages/cpp-ml/build-arm64
          -DCMAKE_BUILD_TYPE=Release
          -DHANDOFFKIT_ML_LINK_CORE=ON
          -DHANDOFFKIT_ML_TLS=ON
          -DHANDOFFKIT_ML_BUILD_TESTS=ON
          -DHANDOFFKIT_ML_BUILD_CLI=OFF
          -DHANDOFFKIT_BUILD_TESTS=OFF
          -DHANDOFFKIT_BUILD_EXAMPLES=OFF
          -DHANDOFFKIT_BUILD_CLI=OFF
          -DHANDOFFKIT_BUILD_DEMOS=OFF

      - name: Test native ARM64 cpp-ml CPU worker and secure gateway
        env:
          HANDOFFKIT_CPP_ML_WORKER: ${{ github.workspace }}/packages/cpp-ml/build-arm64/handoffkit-cpp-ml-worker
        run: |
          cmake --build packages/cpp-ml/build-arm64 --parallel 2
          ctest --test-dir packages/cpp-ml/build-arm64 --output-on-failure
          (cd packages/go && go test -tags=cppmlintegration -race ./mlgateway)

      - name: Test bidirectional Node/Go/Rust and C++ TCP matrix on Linux ARM64
        env:
          HANDOFFKIT_CPP_ML_WORKER: ${{ github.workspace }}/packages/cpp-ml/build-arm64/handoffkit-cpp-ml-worker
        run: |
          python packages/cpp-ml/tests/interop/test_tcp_interoperability.py \
            "$HANDOFFKIT_CPP_ML_WORKER" \
            > .local-tests/cpp-tcp-interoperability-linux-arm64.json
          python -c "import json; value=json.load(open('.local-tests/cpp-tcp-interoperability-linux-arm64.json')); assert set(value['clients']) == {'python','node','go','rust'}; assert set(value['reverse_servers']) == {'python','node','go','rust'}; assert all(item['protocol'] == 'TLSv1.3' for item in value['clients'].values()); assert all(item['protocol'] == 'TLSv1.3' for item in value['reverse_servers'].values())"

  arm64-macos:
    name: macOS ARM64 runtime qualification
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prove execution is native ARM64
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/python[dev]"
          pnpm install --frozen-lockfile

      - name: Test Python and JavaScript ARM64 security routes
        run: |
          python -m pytest -q \
            packages/python/tests/test_edge_profiles.py \
            packages/python/tests/test_durable_replay.py \
            packages/python/tests/test_csp_tls_integration.py
          pnpm --dir packages/js/csp test
          pnpm --dir packages/js/node test

      - name: Test Go and Rust ARM64 security routes
        run: |
          (cd packages/go && go test -race ./edgeprofile ./security ./artifactgate ./transport)
          cargo test --manifest-path packages/rust/Cargo.toml --locked -p handoffkit-protocol -p handoffkit-transport

      - name: Configure C++ ARM64 crypto and provider-detected keystore
        run: |
          brew install openssl@3
          cmake -S packages/cpp -B packages/cpp/build-macos-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DHANDOFFKIT_WITH_HTTP=OFF \
            -DHANDOFFKIT_WITH_CRYPTO=ON \
            -DHANDOFFKIT_WITH_TLS=ON \
            -DHANDOFFKIT_BUILD_EXAMPLES=OFF \
            -DHANDOFFKIT_BUILD_DEMOS=OFF \
            -DHANDOFFKIT_BUILD_CLI=OFF

      - name: Test C++ ARM64 recovery, keystore, signatures, and edge routes
        run: |
          cmake --build packages/cpp/build-macos-arm64 --parallel 2 \
            --target test_edge_profiles test_csp_security test_os_keystore \
              test_secure_memory test_durable_scheduler test_artifact_signatures test_tls_transport
          ctest --test-dir packages/cpp/build-macos-arm64 --output-on-failure \
            -R '^(test_edge_profiles|test_csp_security|test_os_keystore|test_secure_memory|test_durable_scheduler|test_artifact_signatures|test_tls_transport)$'

      - name: Configure native macOS ARM64 cpp-ml TLS worker
        run: |
          cmake -S packages/cpp-ml -B packages/cpp-ml/build-macos-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DHANDOFFKIT_CORE_SOURCE_DIR=${{ github.workspace }}/packages/cpp \
            -DHANDOFFKIT_ML_LINK_CORE=ON \
            -DHANDOFFKIT_ML_TLS=ON \
            -DHANDOFFKIT_ML_BUILD_TESTS=ON \
            -DHANDOFFKIT_ML_BUILD_CLI=OFF \
            -DHANDOFFKIT_BUILD_TESTS=OFF \
            -DHANDOFFKIT_BUILD_EXAMPLES=OFF \
            -DHANDOFFKIT_BUILD_CLI=OFF \
            -DHANDOFFKIT_BUILD_DEMOS=OFF

      - name: Test native macOS ARM64 cpp-ml and bidirectional TCP matrix
        env:
          HANDOFFKIT_CPP_ML_WORKER: ${{ github.workspace }}/packages/cpp-ml/build-macos-arm64/handoffkit-cpp-ml-worker
        run: |
          cmake --build packages/cpp-ml/build-macos-arm64 --parallel 2
          ctest --test-dir packages/cpp-ml/build-macos-arm64 --output-on-failure
          python packages/cpp-ml/tests/interop/test_tcp_interoperability.py \
            "$HANDOFFKIT_CPP_ML_WORKER" \
            > .local-tests/cpp-tcp-interoperability-macos-arm64.json
          python -c "import json; value=json.load(open('.local-tests/cpp-tcp-interoperability-macos-arm64.json')); assert set(value['clients']) == {'python','node','go','rust'}; assert set(value['reverse_servers']) == {'python','node','go','rust'}; assert all(item['protocol'] == 'TLSv1.3' for item in value['clients'].values()); assert all(item['protocol'] == 'TLSv1.3' for item in value['reverse_servers'].values())"

  go-pq:
    name: Go 1.26 hybrid-PQ provider and Node interoperability
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up provider-compatible Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Set up provider-compatible Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python for ephemeral TLS fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install TLS fixture generator dependency
        run: python -m pip install "cryptography>=46,<50"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Prove X25519MLKEM768 negotiation, downgrade rejection, and Node interoperability
        env:
          GODEBUG: tlsmlkem=1
          HANDOFFKIT_REQUIRE_HYBRID_PQ: "1"
          HANDOFFKIT_RUN_HYBRID_INTEROP: "1"
        run: >
          go test -count=1
          -run "TestGoHybridPQNegotiatesX25519MLKEM768|TestGoHybridPQRejectsDirectStandardTLSWrapping|TestGoNodeHybridPQMTLSInteroperability"
          ./transport
        working-directory: packages/go

  csp-interop:
    name: HK-CSP Python / JavaScript / Rust / Go stdio
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Install Python package
        run: python -m pip install -e packages/python

      - name: Build Rust worker
        run: cargo build --manifest-path packages/rust/Cargo.toml -p handoffkit-cli

      - name: Build Go worker
        run: |
          mkdir -p .local-tests/bin
          (cd packages/go && go build -o ../../.local-tests/bin/handoffkit-worker ./cmd/handoffkit-worker)

      - name: Rust starts Python, JavaScript, and Go workers
        env:
          HANDOFFKIT_RUN_INTEROP_TESTS: "1"
        run: >
          cargo test --manifest-path packages/rust/Cargo.toml
          -p handoffkit-transport --test cross_runtime -- --nocapture

      - name: Go starts Python, JavaScript, and Rust workers
        env:
          HANDOFFKIT_RUN_INTEROP_TESTS: "1"
        run: >
          (cd packages/go && go test -v ./interop/...)

      - name: Python starts JavaScript worker
        run: python packages/python/examples/csp_python_js_stdio_demo.py

      - name: Python starts Rust worker
        run: python packages/python/examples/csp_python_rust_stdio_demo.py

      - name: Python starts Go worker
        run: python packages/python/examples/csp_python_go_stdio_demo.py

      - name: JavaScript starts Rust worker
        run: node packages/js/node/examples/csp_js_rust_stdio_demo.mjs

      - name: JavaScript starts Go worker
        run: node packages/js/node/examples/csp_js_go_stdio_demo.mjs

